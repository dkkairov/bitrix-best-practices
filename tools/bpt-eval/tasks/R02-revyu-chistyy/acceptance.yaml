# Ревью почти чистого шаблона: один настоящий дефект и две ловушки. Задача ловит склонность
# «найти проблему везде» — на таком шаблоне придирок будет больше, чем дефектов.
task: R02
document: Заявки
kind: review
input: input.bizproc.yaml
defects:
  - id: sender-on-timeout
    text: "У задания есть срок, а уведомление об отказе шлётся от «Последнего голосовавшего»: по истечении срока никто не голосовал, отправитель окажется пустым, а причина отказа — пустой строкой"
traps:
  # Ловушка — техническое утверждение, ложное по факту. Вопрос заказчику («кто именно юрист»,
  # «нужна ли стадия на время согласования») ловушкой быть не может: этого мы от агента и ждём.
  # Первая версия задачи этим и ошиблась — прогон mode-1 показал, что так наказывают за правильное.
  - id: stage-last
    text: "Смена стадии стоит последним шагом в обеих ветках, уведомление и запись в историю — до неё: это верный порядок. Утверждение, что их надо перенести после смены стадии, ошибочно"
  - id: crm-event-author
    text: "В ветке «да» автор записи в историю взят из «Последнего голосовавшего» — там голос всегда есть, это верно (в отличие от ветки «нет» со сроком)"
