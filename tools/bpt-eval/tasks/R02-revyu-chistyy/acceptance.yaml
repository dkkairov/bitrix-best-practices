# Ревью почти чистого шаблона: один настоящий дефект и три ловушки. Задача ловит склонность
# «найти проблему везде» — на таком шаблоне придирок будет больше, чем дефектов.
task: R02
document: Заявки
kind: review
input: input.bizproc.yaml
defects:
  - id: sender-on-timeout
    text: "У задания есть срок, а уведомление об отказе шлётся от «Последнего голосовавшего»: по истечении срока никто не голосовал, отправитель окажется пустым, а причина отказа — пустой строкой"
traps:
  - id: approve-any
    text: "ApproveType any («решает первый ответивший») при одном согласующем — верно, а не недосмотр"
  - id: no-stage-on-start
    text: "Процесс не переводит заявку на стадию «Согласование» в начале — так и надо: смена стадии завершила бы процесс на первом шаге"
  - id: created-by
    text: "Инициатор берётся как {=Document:CREATED_BY}, а не {=User:ID} — верно: процесс может продолжиться в другом сеансе или от агента"
