  Общая/Новая: "DT1000_10:NEW"
  Общая/Клиент: "DT1000_10:CLIENT"
  Общая/Доработка: "DT1000_10:UC_REWORK"

users:
  Иванов Иван: user_42

groups:
  Бухгалтерия: group_g7
  Отдел продаж: group_d3

smart:
  Заявки: 1000

templates:
  Обязательное согласование: 900
