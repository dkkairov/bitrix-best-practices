# Пример спецификации процесса: согласование счёта.
# Все названия берутся из снимка examples/example.portal.yaml:
#   php tools/bpt/bpt.php compile tools/bpt/examples/invoice-approval.bizproc.yaml \
#       --portal=tools/bpt/examples/example.portal.yaml -o /tmp/invoice.bpt
#   php tools/bpt/bpt.php render /tmp/invoice.bpt

bizproc: 1
name: Согласование счёта
document: DYNAMIC_1000        # тип документа: подсказка при загрузке, в .bpt не пишется

variables:
  amount:
    Name: Сумма к оплате
    Type: double
    Required: true

steps:
  - set_field:
      title: Зафиксировать сумму
      FieldValue:
        "{{field:Сумма к оплате}}": "{=Variable:amount}"

  - approve:
      id: fin
      title: Согласование бухгалтерией
      Users: ["{{group:Бухгалтерия}}"]
      Name: "Согласуйте счёт {=Document:TITLE}"
      Description: "Сумма: {=Variable:amount > printable}"
      TimeoutDuration: "172800"        # двое суток в секундах
      # «Сменить стадию» — последний шаг ветки: так в 42 из 43 случаев корпуса.
      on_yes:
        - crm_event:
            EventText: "Счёт согласован. Комментарий: {=@fin:Comments}"
            EventUser: ["{=@fin:LastApprover}"]
        - change_stage:
            TargetStatus: "{{stage:Общая/Клиент}}"
      on_no:
        - notify:
            MessageSite: "Счёт отклонён: {=@fin:Comments}"
            # «от системы»: при отклонении по сроку никто не голосовал и LastApprover пуст
            MessageType: "4"
            MessageUserFrom: ["{{user:Иванов Иван}}"]  # при типе 4 не используется, но без него портал не примет импорт
            MessageUserTo: ["{{user:Иванов Иван}}"]
        - change_stage:
            TargetStatus: "{{stage:Общая/Доработка}}"
